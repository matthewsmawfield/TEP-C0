theory:
  classy:
    path: /tmp/class_tep
    extra_args:
      N_ur: 2.0328
      N_ncdm: 1
      m_ncdm: 0.06
      output: mPk
      P_k_max_h/Mpc: 10
likelihood:
  pantheon_plus_likelihood.pantheon_plus:
    python_path: .
params:
  tep_epsilon_T:
    prior:
      min: 0.0
      max: 0.5
    ref: 0.1
    proposal: 0.02
    latex: \\epsilon_T
  tep_z_T:
    prior:
      min: 0.5
      max: 15.0
    ref: 3.0
    proposal: 0.5
    latex: z_T
  tep_n_T:
    value: 1.0
    latex: n_T
  H0:
    prior:
      min: 55.0
      max: 85.0
    ref: 70.0
    proposal: 3.0
    latex: H_0
  omega_b:
    prior:
      min: 0.018
      max: 0.025
    ref: 0.0224
    proposal: 0.0002
    latex: \\Omega_b h^2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.15
    ref: 0.12
    proposal: 0.003
    latex: \\Omega_{cdm} h^2
  tau_reio:
    value: 0.054
    latex: \\tau_{reio}
  A_s:
    value: 2.1e-09
    latex: A_s
  n_s:
    value: 0.966
    latex: n_s
sampler:
  mcmc:
    max_tries: 5000
    burn_in: 0
    Rminus1_stop: 0.1
    covmat: auto
    learn_every: 50
    proposal_scale: 2.4
output: tep_sne_only
derived:
  age:
    latex: '{\rm Age}/{{\rm Gyr}}'
stop:
  max_samples: 5000
verbose: 2
