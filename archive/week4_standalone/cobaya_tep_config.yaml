# Cobaya configuration for TEP cosmology parameter estimation
# Joint fit to Pantheon+ SNe and Planck CMB

# Output settings
output: chains/tep_joint
resume: false
force: true

# Theory code
theory:
  classy:
    path: /tmp/class_tep
    extra_args:
      # TEP parameters - will be varied
      tep_mode: 'yes'
      # LCDM parameters
      N_ur: 2.0328
      N_ncdm: 1
      m_ncdm: 0.06
      # Precision settings
      l_max_scalars: 2500

# Likelihoods
likelihood:
  # Planck 2018 high-l TTTEEE
  planck_2018_highl_plik.TTTEEE:
    # Uses Planck 2018 plik likelihood
  
  # Planck 2018 low-l (commander)
  planck_2018_lowl.TT:
    
  # Planck 2018 low-l EE
  planck_2018_lowl.EE:
    
  # Pantheon+ SNe Ia
  pantheon_plus:
    # Will need custom implementation or use existing

# Parameters to vary
params:
  # TEP parameters
  tep_epsilon_T:
    prior:
      min: 0.0
      max: 0.5
    ref: 0.1
    proposal: 0.01
    latex: \\epsilon_T
  
  tep_z_T:
    prior:
      min: 0.5
      max: 20.0
    ref: 5.0
    proposal: 0.5
    latex: z_T
  
  tep_n_T:
    value: 1.0  # Fixed for now
    latex: n_T
  
  # LCDM parameters
  H0:
    prior:
      min: 50.0
      max: 100.0
    ref: 70.0
    proposal: 2.0
    latex: H_0
  
  omega_b:
    prior:
      min: 0.018
      max: 0.025
    ref: 0.0224
    proposal: 0.0002
    latex: \\Omega_b h^2
  
  omega_cdm:
    prior:
      min: 0.10
      max: 0.15
    ref: 0.120
    proposal: 0.003
    latex: \\Omega_{cdm} h^2
  
  tau_reio:
    prior:
      min: 0.01
      max: 0.10
    ref: 0.054
    proposal: 0.007
    latex: \\tau_{reio}
  
  A_s:
    prior:
      min: 1.5e-9
      max: 2.5e-9
    ref: 2.1e-9
    proposal: 0.15e-9
    latex: A_s
  
  n_s:
    prior:
      min: 0.90
      max: 1.05
    ref: 0.966
    proposal: 0.006
    latex: n_s

# Derived parameters
derived:
  age:
    latex: "{\\rm Age}/{{\\rm Gyr}}"
  rs_drag:
    latex: r_s
  theta_s_100:
    latex: 100\\theta_*

# Sampler settings
sampler:
  mcmc:
    # Number of MCMC steps
    max_tries: 100000
    # Burn-in
    burn_in: 0
    # Convergence criterion
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    # Proposal covariance matrix
    covmat: auto
    # Learning starts after
    learn_every: 200
    # Learning rate
    learning_rate: 0.3
    # Proposal scale
    proposal_scale: 2.4

# Stop conditions
stop:
  early:
    # Stop if convergence achieved
    Rminus1: 0.01
  # Or after N samples
  max_samples: 100000

# Logging
debug: false
verbose: 1
